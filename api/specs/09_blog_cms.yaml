openapi: 3.0.3
info:
  title: Blog CMS API
  version: 1.0.0
  description: Generic API for managing blog posts and tags.
servers:
- url: https://api.example.com/blog
paths:
  /posts:
    get:
      tags:
      - Blog
      summary: List posts
      operationId: listPosts
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - items
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
      - Blog
      summary: Create Post
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
  /posts/{postId}:
    get:
      tags:
      - Blog
      summary: Get Post by postId
      operationId: getPost
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Blog
      summary: Update Post
      operationId: updatePost
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Blog
      summary: Delete Post
      operationId: deletePost
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'
  /tags:
    get:
      tags:
      - Blog
      summary: List tags
      operationId: listTags
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
    post:
      tags:
      - Blog
      summary: Create tag
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tag'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error message.
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
      required:
      - code
      - message
    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title: &id001
          type: string
        slug: &id002
          type: string
        content: &id003
          type: string
        published: &id004
          type: boolean
        publishedAt: &id005
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - title
      - slug
      - content
      - published
    PostCreate:
      type: object
      properties:
        title: *id001
        slug: *id002
        content: *id003
        published: *id004
        publishedAt: *id005
      required:
      - title
      - slug
      - content
      - published
    PostUpdate:
      type: object
      properties:
        title: *id001
        slug: *id002
        content: *id003
        published: *id004
        publishedAt: *id005
    Tag:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
